; =====================================================================
;  ScreenCam ONVIF - configuracao
;  Arquivo: C:\ProgramData\ScreenCamONVIF\config.ini
;  Apos alterar, reinicie o servico (como administrador):
;     ScreenCamONVIF.exe stop   &&   ScreenCamONVIF.exe start
;  Este arquivo contem a senha do NVR e fica legivel apenas para administradores.
;  Placeholders aceitos em "name" e "overlay_text": {computer} e {user}
; =====================================================================

[device]
name = @NAME@
manufacturer = ScreenCam
model = ScreenCam ONVIF
location = Escritorio

[auth]
; Credenciais usadas pelo NVR (ONVIF e RTSP).
; IMPORTANTE: a senha deve ter 10 caracteres (exigencia de gravadores Intelbras/Hikvision).
; A senha e cifrada automaticamente (DPAPI) na instalacao e vira "enc:v1:...".
; Para trocar: escreva a nova senha (10 caracteres) em texto aqui e rode, como admin:
;     ScreenCamONVIF.exe stop && ScreenCamONVIF.exe protect-config && ScreenCamONVIF.exe start
enabled = true
username = @USER@
password = @PASS@

[network]
; IP em que os servicos escutam (0.0.0.0 = todas as placas de rede)
bind_ip = 0.0.0.0
; IP informado ao NVR. "auto" detecta; fixe aqui se o PC tiver varias placas/VPN
advertise_ip = auto
onvif_port = @ONVIF_PORT@
rtsp_port = @RTSP_PORT@
; Responder a busca automatica (WS-Discovery) do NVR
discovery = true
; IP do NVR/gravador ao qual este dispositivo pertence. Vazio = qualquer NVR da
; rede local. Preenchido, o acesso de leitura (RTSP/ONVIF) e o firewall ficam
; restritos a esse IP (como uma camera dedicada aquele gravador).
nvr_ip = @NVR_IP@

[service]
; service = servico SYSTEM + agente por sessao (producao: o usuario comum nao fecha
;           o programa e todos os usuarios da maquina sao gravados)
; console = tudo em um processo na sessao atual (uso simples de um unico usuario)
mode = service
; Canal UNICO compartilhado: grava sempre a sessao ativa; ao trocar de usuario (troca
; de usuario no console ou varias sessoes RDP) o canal segue quem estiver ativo. Todos
; os usuarios sao gravados no mesmo canal do NVR, um de cada vez.
;   active_console = prioriza o monitor fisico (recomendado)
;   all_sessions   = tambem canal unico; entre sessoes RDP, segue a de menor ID
capture_scope = active_console
; Mostrar um icone discreto na bandeja da sessao do usuario (false = oculto)
visible_indicator = false

[autoregister]
; REGISTRO ATIVO NO NVR (EXPERIMENTAL). Use somente se a busca automatica nao
; encontrar a camera - tipico quando o PC e o NVR estao em SUB-REDES DIFERENTES
; (ex.: 192.168.25.x e 192.168.26.x) ou ha NAT. Em vez de esperar o NVR conectar,
; o programa conecta no NVR (igual a tela "End. servidor / ID dispositivo" das
; cameras Intelbras/Dahua) e abre um tunel ate o servico ONVIF local.
; Observacao: o formato exato do handshake varia por modelo de NVR; pode ser
; necessario ajustar. Veja o README (secao "Registro ativo no NVR").
enabled = @AR_ENABLED@
; IP do NVR (End. servidor). Em branco usa o nvr_ip de [network].
server_ip = @AR_SERVER@
; Porta do "Registro Automatico" configurada no NVR
server_port = @AR_PORT@
; ID do dispositivo definido no NVR
device_id = @AR_DEVID@
; Usuario/senha de login no NVR, se o registro exigir (senha cifrada via DPAPI)
username = @AR_USER@
password = @AR_PASS@
; Servico local exposto pelo tunel: onvif (gerenciamento) ou rtsp (video)
target = onvif

[video]
; all = todos os monitores; 1, 2... = monitor especifico (1 = principal)
monitor = all
fps = 15
max_width = 1920
max_height = 1080
; Codec: h265 (menor disco; o NVR precisa suportar H.265) | h264 (compatibilidade maxima)
codec = h265
; auto = testa GPU NVIDIA/Intel/AMD e usa a CPU se nao houver | cpu | nvenc | qsv | amf
encoder = auto
; vbr = qualidade constante; tela parada gasta quase nada (recomendado) | cbr = bitrate fixo
rate_control = vbr
; Qualidade (CRF/CQ). 0 = automatico (28 em H.265, 25 em H.264). Maior = menor arquivo
quality = 0
; Teto de bitrate em kbps (VBR) ou bitrate fixo (CBR)
bitrate_kbps = 1500
; Segundos entre quadros-chave. Maior = MENOS disco, porem o ao vivo demora mais a abrir
; e a busca na gravacao fica menos precisa. 4 = equilibrio; 8 a 10 = maxima economia
gop_seconds = 4
draw_mouse = true
; Carimbo com computador, usuario, data e hora no video
overlay = true
overlay_text = {computer} - {user}
font = Arial

[audio]
enabled = true
; Som que sai das caixas/fones (WASAPI loopback)
system_audio = true
microphone = true
system_gain = 1.0
mic_gain = 1.0
; aac (melhor qualidade) | g711 (maior compatibilidade com NVRs antigos)
codec = aac
bitrate_kbps = 96

[activity]
; Segundos sem mouse/teclado para encerrar o evento de "movimento" enviado ao NVR
idle_timeout_seconds = 30
; continuous  = stream sempre ativo; o NVR grava pelo evento de movimento (recomendado)
; on_activity = so transmite enquanto houver atividade (economiza CPU/rede, NVR mostra offline quando ocioso)
stream_mode = continuous
poll_interval_ms = 250

[recording]
; Gravacao local de backup (alem do NVR), somente durante atividade
enabled = false
directory = C:\ProgramData\ScreenCamONVIF\recordings
segment_minutes = 10
retention_days = 30
max_size_gb = 50
