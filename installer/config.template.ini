; =====================================================================
;  ScreenCam ONVIF - configuracao
;  Arquivo: C:\ProgramData\ScreenCamONVIF\config.ini
;  Apos alterar, reinicie o programa (icone na bandeja > Sair e abrir de novo).
;  Placeholders aceitos em "name" e "overlay_text": {computer} e {user}
; =====================================================================

[device]
name = @NAME@
manufacturer = ScreenCam
model = ScreenCam ONVIF
location = Escritorio

[auth]
; Credenciais usadas pelo NVR (ONVIF e RTSP)
enabled = true
username = @USER@
password = @PASS@

[network]
; IP em que os servicos escutam (0.0.0.0 = todas as placas de rede)
bind_ip = 0.0.0.0
; IP informado ao NVR. "auto" detecta; fixe aqui se o PC tiver varias placas/VPN
advertise_ip = auto
onvif_port = @ONVIF_PORT@
rtsp_port = @RTSP_PORT@
; Responder a busca automatica (WS-Discovery) do NVR
discovery = true

[video]
; all = todos os monitores; 1, 2... = monitor especifico (1 = principal)
monitor = all
fps = 15
max_width = 1920
max_height = 1080
bitrate_kbps = 2000
; libx264 (CPU) | h264_nvenc (NVIDIA) | h264_qsv (Intel) | h264_amf (AMD)
encoder = libx264
draw_mouse = true
; Carimbo com computador, usuario, data e hora no video
overlay = true
overlay_text = {computer} - {user}
font = Arial

[audio]
enabled = true
; Som que sai das caixas/fones (WASAPI loopback)
system_audio = true
microphone = true
system_gain = 1.0
mic_gain = 1.0
; aac (melhor qualidade) | g711 (maior compatibilidade com NVRs antigos)
codec = aac
bitrate_kbps = 96

[activity]
; Segundos sem mouse/teclado para encerrar o evento de "movimento" enviado ao NVR
idle_timeout_seconds = 30
; continuous  = stream sempre ativo; o NVR grava pelo evento de movimento (recomendado)
; on_activity = so transmite enquanto houver atividade (economiza CPU/rede, NVR mostra offline quando ocioso)
stream_mode = continuous
poll_interval_ms = 250

[recording]
; Gravacao local de backup (alem do NVR), somente durante atividade
enabled = false
directory = C:\ProgramData\ScreenCamONVIF\recordings
segment_minutes = 10
retention_days = 30
max_size_gb = 50
