name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow pytest onvif-zeep-async
      - run: python -m pytest -q tests

  installer-windows:
    runs-on: windows-latest
    needs: tests-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Guarda ffmpeg.exe/mediamtx.exe entre execucoes: evita rebaixar (e sofrer
      # com instabilidade de gyan.dev) quando os downloads nao mudaram.
      - name: Cache binarios externos (FFmpeg, MediaMTX)
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/build.ps1') }}
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCamONVIF-Setup
          path: installer/Output/*.exe

  # Instala o instalador de verdade num Windows limpo (com administrador), tenta ativar o
  # servico e valida ONVIF/RTSP/logs - o mesmo caminho que falha numa maquina real.
  install-test-windows:
    runs-on: windows-latest
    needs: installer-windows
    env:
      TEST_PASS: Teste12345A
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ScreenCamONVIF-Setup
          path: setup
      - name: Estado inicial da maquina (portas em uso)
        shell: powershell
        run: |
          Get-NetTCPConnection -State Listen | Select-Object LocalPort, OwningProcess | Sort-Object LocalPort | Format-Table -AutoSize | Out-String -Width 200
          Get-Service W3SVC, WinRM -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String
      - name: Instalar silenciosamente
        shell: powershell
        run: |
          $exe = (Get-ChildItem setup -Filter *.exe | Select-Object -First 1).FullName
          Write-Host "Instalador: $exe"
          $p = Start-Process -FilePath $exe -PassThru -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$PWD\install.log",
            '/NVRIP=192.168.25.200','/USER=admin',"/PASS=$env:TEST_PASS",'/ONVIFPORT=80')
          $limite = (Get-Date).AddSeconds(240)
          $ultimo = 0
          while (-not $p.HasExited -and (Get-Date) -lt $limite) {
            Start-Sleep -Seconds 10
            if (Test-Path install.log) {
              $linhas = @(Get-Content install.log)
              if ($linhas.Count -gt $ultimo) { $linhas[$ultimo..($linhas.Count-1)] | ForEach-Object { Write-Host "  | $_" }; $ultimo = $linhas.Count }
            }
          }
          if (-not $p.HasExited) {
            Write-Host "[FALHA] o instalador travou (240 s). Processos em execucao:"
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'ScreenCam|mediamtx|ffmpeg|unins|Setup|sc.exe|icacls|netsh|taskkill' } |
              Select-Object Name, ProcessId, ParentProcessId, CommandLine | Format-List | Out-String -Width 250 | Write-Host
            Get-Service ScreenCamONVIF -ErrorAction SilentlyContinue | Format-List * | Out-String | Write-Host
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Codigo de saida do instalador: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Verificar instalacao (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/verificar-instalacao.ps1 -User admin -Password $env:TEST_PASS -RequireStream
      - name: Status e diagnostico (doctor)
        if: always()
        shell: powershell
        run: |
          & "$env:ProgramFiles\ScreenCamONVIF\ScreenCamONVIF.exe" status
          & "$env:ProgramFiles\ScreenCamONVIF\ScreenCamONVIF.exe" doctor
          exit 0
      - name: Reparar com reparar.ps1 (cenario de reinstalacao por cima)
        shell: powershell
        run: ./scripts/reparar.ps1 -NvrIp 192.168.25.200 -User admin -Password $env:TEST_PASS -OnvifPort 80 -NoPause
      - name: Desinstalar e conferir limpeza
        shell: powershell
        run: |
          $u = Join-Path $env:ProgramFiles "ScreenCamONVIF\unins000.exe"
          $p = Start-Process -FilePath $u -Wait -PassThru -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          Write-Host "Desinstalador: codigo $($p.ExitCode)"
          Start-Sleep -Seconds 3
          if (Get-Service ScreenCamONVIF -ErrorAction SilentlyContinue) { Write-Host "[FALHA] servico ainda existe"; exit 1 }
          if (Get-Process mediamtx -ErrorAction SilentlyContinue) { Write-Host "[FALHA] mediamtx ainda roda"; exit 1 }
          Write-Host "[OK] servico e processos removidos"
      - name: Coletar logs
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item "$env:ProgramData\ScreenCamONVIF\logs\*" logs -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Users\*\AppData\Local\ScreenCamONVIF\logs\*.log" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName ("logs\agente-" + $_.Name) }
          Copy-Item install.log logs -ErrorAction SilentlyContinue
          Get-WinEvent -FilterHashtable @{LogName='System';ProviderName='Service Control Manager'} -MaxEvents 30 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Message | Out-File logs\eventos-scm.txt
      - name: Publicar logs do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-teste-instalacao
          path: logs
